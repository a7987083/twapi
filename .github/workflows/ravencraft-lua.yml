name: RavenCraft Lua syntax
on:
  push:
    branches: [feat/ravencraft-api-explorer]
  workflow_dispatch:
jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua source syntax
        run: |
          luac5.1 -p RavenAPIExplorer/Core.lua
          luac5.1 -p RavenAPIExplorer/UI.lua
